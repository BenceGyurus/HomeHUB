services:
  homehub:
    build: .
    image: ghcr.io/bencegyurus/homehub:latest
    container_name: homehub
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - AUTH_TRUST_HOST=true
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-super-secret-change-me}
      - DATABASE_PATH=/app/data/homehub.db
