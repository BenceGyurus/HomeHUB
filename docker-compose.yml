services:
  homehub:
    build: .
    image: ghcr.io/gyurus/homehub:latest
    container_name: homehub
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - NEXTAUTH_URL=https://gyurus.hu
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-super-secret-change-me}
      - DATABASE_PATH=/app/data/homehub.db
